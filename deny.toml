# cargo-deny policy. Run locally: cargo deny check
[graph]
all-features = true

[advisories]
yanked = "deny"
# An advisory with no fixed version is listed here with its RUSTSEC id and
# the reason exposure is acceptable. No silent allowlists.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
