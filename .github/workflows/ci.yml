name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (check, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Test
        run: npm test
      # The build also checks that no page loads anything from another
      # origin and that every page carries the gateway's markers.
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build
          retention-days: 3

  gateway:
    name: gateway (fmt, clippy, test)
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The gateway's tests fill every page of the real build.
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web/build
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all --locked
        env:
          SATD_SITE_WEB_BUILD: ${{ github.workspace }}/web/build

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check
